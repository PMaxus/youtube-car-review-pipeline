<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="660" fill="#ffffff"/>

  <text x="510" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">YouTube → AI car-review pipeline — architecture</text>
  <text x="510" y="51" text-anchor="middle" font-size="12.5" fill="#64748b">Routine steps automated; a human stays in control at the one step that decides quality</text>

  <!-- Actors / orchestrator -->
  <rect x="24" y="150" width="120" height="58" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="84" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">User</text>
  <text x="84" y="192" text-anchor="middle" font-size="11.5" fill="#7e22ce">Telegram</text>

  <rect x="24" y="300" width="120" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="84" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Main</text>
  <text x="84" y="342" text-anchor="middle" font-size="11" fill="#4338ca">orchestrator</text>

  <rect x="24" y="430" width="120" height="50" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="84" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">send_menu</text>

  <!-- External services -->
  <rect x="165" y="175" width="130" height="50" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="230" y="197" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">YouTube Data API</text>
  <text x="230" y="213" text-anchor="middle" font-size="10" fill="#0f766e">search</text>
  <rect x="445" y="175" width="130" height="50" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="510" y="197" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">ScrapeCreators</text>
  <text x="510" y="213" text-anchor="middle" font-size="10" fill="#0f766e">transcripts</text>
  <rect x="585" y="175" width="130" height="50" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="650" y="197" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">OpenRouter (LLM)</text>
  <text x="650" y="213" text-anchor="middle" font-size="10" fill="#b45309">summarize</text>
  <rect x="865" y="175" width="130" height="50" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="930" y="197" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">InWorld (TTS)</text>
  <text x="930" y="213" text-anchor="middle" font-size="10" fill="#0f766e">voiceover</text>

  <!-- Pipeline stages -->
  <!-- S1 -->
  <rect x="168" y="300" width="124" height="72" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="230" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">youtube_search</text>
  <text x="230" y="350" text-anchor="middle" font-size="10.5" fill="#4338ca">rank candidates</text>
  <!-- S2 highlight -->
  <rect x="308" y="300" width="124" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">source selection</text>
  <text x="370" y="345" text-anchor="middle" font-size="10.5" fill="#b45309">human-in-the-loop</text>
  <text x="370" y="361" text-anchor="middle" font-size="9.5" fill="#b45309">(Telegram cards)</text>
  <!-- S3 -->
  <rect x="448" y="300" width="124" height="72" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="510" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">get_transcripts</text>
  <text x="510" y="350" text-anchor="middle" font-size="10.5" fill="#4338ca">confirmed videos</text>
  <!-- S4 -->
  <rect x="588" y="300" width="124" height="72" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="650" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">summaries</text>
  <text x="650" y="345" text-anchor="middle" font-size="10.5" fill="#4338ca">per video</text>
  <text x="650" y="361" text-anchor="middle" font-size="9.5" fill="#4338ca">(separate)</text>
  <!-- S5 -->
  <rect x="728" y="300" width="124" height="72" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="790" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">get_main_summary</text>
  <text x="790" y="350" text-anchor="middle" font-size="10.5" fill="#4338ca">assemble review</text>
  <!-- S6 -->
  <rect x="868" y="300" width="124" height="72" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="930" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">hotmode</text>
  <text x="930" y="350" text-anchor="middle" font-size="10.5" fill="#4338ca">voiceover</text>

  <!-- Arrows: actors -->
  <line x1="84" y1="208" x2="84" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="84" y1="358" x2="84" y2="430" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="90" y="416" text-anchor="start" font-size="10" fill="#475569">menu</text>
  <line x1="144" y1="332" x2="166" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Arrows: pipeline chain -->
  <line x1="292" y1="336" x2="306" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="432" y1="336" x2="446" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="572" y1="336" x2="586" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="712" y1="336" x2="726" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="852" y1="336" x2="866" y2="336" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Arrows: stage -> external service (upward) -->
  <line x1="230" y1="300" x2="230" y2="227" stroke="#0d9488" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="510" y1="300" x2="510" y2="227" stroke="#0d9488" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="650" y1="300" x2="650" y2="227" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="930" y1="300" x2="930" y2="227" stroke="#0d9488" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Human-in-the-loop callout -->
  <text x="370" y="392" text-anchor="middle" font-size="10" fill="#b45309">user confirms each source — expensive steps start only after this</text>

  <!-- PostgreSQL backbone -->
  <rect x="150" y="476" width="842" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="166" y="500" font-size="13" font-weight="700" fill="#075985">PostgreSQL — process state (restart-safe · auditable · intervene at any step)</text>
  <rect x="166" y="516" width="150" height="40" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="241" y="541" text-anchor="middle" font-size="12" fill="#075985">sessions</text>
  <rect x="332" y="516" width="150" height="40" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="407" y="541" text-anchor="middle" font-size="12" fill="#075985">jobs</text>
  <rect x="498" y="516" width="170" height="40" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="583" y="541" text-anchor="middle" font-size="12" fill="#075985">job_videos</text>
  <rect x="684" y="516" width="180" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="774" y="535" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">prompt_library</text>
  <text x="774" y="550" text-anchor="middle" font-size="9.5" fill="#b45309">prompts as data</text>

  <text x="166" y="582" font-size="11.5" fill="#0369a1">● jobs status:  searching → awaiting_confirmation → transcribing → summarizing → assembling → voicing → done / error</text>
  <text x="166" y="602" font-size="11.5" fill="#0369a1">● prompt_library: versioned prompts (structure only — texts not published)</text>

  <!-- dashed read/write links from pipeline to PG -->
  <line x1="510" y1="372" x2="510" y2="474" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#arrowDb)" marker-end="url(#arrowDb)"/>
  <line x1="790" y1="372" x2="700" y2="474" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#arrowDb)" marker-end="url(#arrowDb)"/>
  <text x="516" y="430" text-anchor="start" font-size="10" fill="#0369a1">read / write</text>

  <!-- Legend -->
  <rect x="150" y="636" width="13" height="13" rx="2" fill="#eef2ff" stroke="#6366f1"/>
  <text x="169" y="647" font-size="11" fill="#334155">n8n workflow</text>
  <rect x="280" y="636" width="13" height="13" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="299" y="647" font-size="11" fill="#334155">human step / LLM</text>
  <rect x="430" y="636" width="13" height="13" rx="2" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="449" y="647" font-size="11" fill="#334155">external API</text>
  <rect x="560" y="636" width="13" height="13" rx="2" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="579" y="647" font-size="11" fill="#334155">PostgreSQL</text>
  <rect x="690" y="636" width="13" height="13" rx="2" fill="#faf5ff" stroke="#9333ea"/>
  <text x="709" y="647" font-size="11" fill="#334155">people / Telegram</text>
</svg>
